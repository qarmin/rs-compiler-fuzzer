[workspace]
members = ["rs-minimizer"]

[package]
name = "rs-compiler-fuzzer"
version = "0.1.0"
edition = "2024"

[dependencies]
rs-minimizer = { path = "rs-minimizer" }
# readable symbol names in the compiler backtraces quoted in issue drafts
rustc-demangle = "0.1"
cpp_demangle = "0.4"
# progress logs, and a Ctrl+C handler that does not need `unsafe`
log = "0.4"
handsome_logger = "0.9"
ctrlc = "3"
