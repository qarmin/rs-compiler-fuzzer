name: retriage

# Every stored finding carries the `fuzzer_id` of the triage logic that produced its reduced program, regression
# range and flags (finding.json / status.cfg). When src/triage.rs bumps FUZZER_ID because the minimisation or the
# bisect got better, this job triages the older findings again and replaces them in the single package, so old
# entries do not stay as unminimised leftovers. Findings that already are at the current id are left alone.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Findings per shard"
        default: "4"
      reduce_seconds:
        description: "Reduction time per finding"
        default: "900"
      bisect_seconds:
        description: "Regression-range time per finding"
        default: "1200"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE: Nightly

jobs:
  retriage:
    name: retriage (shard ${{ matrix.shard }})
    runs-on: ubuntu-26.04
    timeout-minutes: 175
    strategy:
      fail-fast: false
      matrix:
        shard: ["0/3", "1/3", "2/3"]
    steps:
      - uses: actions/checkout@v6
      - name: Toolchains and reducers
        run: |
          for c in stable beta nightly; do rustup toolchain install $c --profile minimal; done
          rustup component add miri rust-src --toolchain nightly || echo "miri unavailable on this nightly"
          python3 -m venv "$HOME/sr" && "$HOME/sr/bin/pip" install -q shrinkray && echo "$HOME/sr/bin" >> "$GITHUB_PATH" || echo "shrinkray unavailable"
          cargo +stable install treereduce-rust --locked || echo "treereduce-rust unavailable"
      - run: cargo +stable build --release

      - name: Download the package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pkg
          if gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" --pattern findings.zip --dir . 2>/dev/null; then unzip -q -o findings.zip -d pkg; fi
          ls pkg/findings 2>/dev/null | wc -l | sed 's/$/ stored findings/'

      - name: Triage the stale findings again
        env:
          GH_TOKEN: ${{ github.token }}
          LIMIT: ${{ inputs.limit || '4' }}
          REDUCE: ${{ inputs.reduce_seconds || '900' }}
          BISECT: ${{ inputs.bisect_seconds || '1200' }}
        run: |
          ./target/release/rs-compiler-fuzzer retriage --pkg pkg --shard "${{ matrix.shard }}" --limit "$LIMIT" \
            --budget "$REDUCE" --bisect "$BISECT" --deadline $((160 * 60)) --out retriage-out | tee retriaged.txt
          sed -n 's/^RETRIAGED //p' retriaged.txt > retriaged-keys.txt
          echo "re-triaged: $(wc -l < retriaged-keys.txt)" >> "$GITHUB_STEP_SUMMARY"

      - name: Store the results (same single-package sync as the fuzz jobs)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s retriaged-keys.txt ] || { echo "nothing re-triaged"; exit 0; }
          mkdir -p upd
          while read -r k; do cp -r "pkg/findings/$k" "upd/$k"; done < retriaged-keys.txt
          export BIN=$PWD/target/release/rs-compiler-fuzzer KEYS_FILE=$PWD/stored-keys.txt ADD_DIRS="upd" TOOLCHAIN=retriage
          tools/release_sync.sh tools/store_mutator.sh

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: retriage-${{ strategy.job-index }}
          path: |
            upd
            retriaged.txt
          if-no-files-found: ignore
          retention-days: 14
