name: retriage

# This is the triage stage of the pipeline (reproduce on every channel, Shrink Ray reduction, shortest flags, Miri,
# exact regression range, GitHub search), kept out of the fuzz jobs so that a job limit or a lost runner cannot
# swallow findings: the fuzz jobs only store raw findings in the package, this workflow picks them up when the fuzz
# run finishes (and once a day for everything that is outdated).
#
# Every stored finding has a checklist (src/steps.rs, `step.*` in status.cfg / finding.json): reproduced, fully minimised,
# shortest flags, Miri, MIR-vs-LLVM, regression range (stable / nightly / PR), upstream search, issue draft. This job
# continues every finding with open steps - closest to completion first - and stores each result right away. A step is
# open again when the tool got better at it (version bump in src/steps.rs) or when a new minimisation changed the
# reduced program (everything derived from the old program is then redone). Finished steps are not repeated.
on:
  workflow_run:
    workflows: [fuzz, miri]
    types: [completed]
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Findings per shard"
        default: "6"
      reduce_seconds:
        description: "Reduction time per finding"
        default: "600"
      reduce_max_seconds:
        description: "Longest minimisation of one finding (it gets what the others in the queue do not need)"
        default: "6000"
      bisect_seconds:
        description: "Regression-range time per finding"
        default: "1500"

permissions:
  contents: write
  actions: read

# one triage run at a time (a second one waits); both would otherwise pick the same findings
concurrency:
  group: retriage
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE: Nightly

jobs:
  retriage:
    name: retriage (shard ${{ matrix.shard }})
    runs-on: ubuntu-26.04
    timeout-minutes: 130
    strategy:
      fail-fast: false
      matrix:
        shard: ["0/4", "1/4", "2/4", "3/4"]
    steps:
      - uses: actions/checkout@v6
      - name: Cache the reducers (Shrink Ray, cargo-bisect-rustc)
        uses: actions/cache@v6
        with:
          path: |
            ~/sr
            ~/.cargo/bin/cargo-bisect-rustc
          key: reducers-${{ runner.os }}-v1
      - name: Toolchains and reducers
        run: |
          for c in stable beta nightly; do rustup toolchain install $c --profile minimal; done
          rustup component add miri rust-src --toolchain nightly || echo "miri unavailable on this nightly"
          [ -x "$HOME/.cargo/bin/cargo-bisect-rustc" ] || cargo +stable install cargo-bisect-rustc --locked || echo "cargo-bisect-rustc unavailable"
      - run: cargo +stable build --release

      # The newest nightly is the reference: a bug that no longer reproduces there (two checks in a row) is removed from the
      # package (`fixed.txt` remembers it). This replaces the former separate verify workflow; one shard does it per run.
      - name: Verify the stored findings on the newest nightly and remove the fixed ones
        if: startsWith(matrix.shard, '0/')
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLCHAIN: nightly
        run: |
          export BIN=$PWD/target/release/rs-compiler-fuzzer
          tools/release_sync.sh tools/verify_mutator.sh
          {
            echo "### nightly: stored findings"
            echo '```'; grep -E '^(STILL|FIXED|REMOVED|verify:)' verify.log || echo '(nothing stored yet)'; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download the package
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pkg
          if gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" --pattern findings.zip --dir . 2>/dev/null; then unzip -q -o findings.zip -d pkg; fi
          ls pkg/findings 2>/dev/null | wc -l | sed 's/$/ stored findings/'

      - name: Triage, one finding at a time, and store each result right away
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          LIMIT: ${{ inputs.limit || '6' }}
          REDUCE: ${{ inputs.reduce_seconds || '600' }}
          REDUCE_MAX: ${{ inputs.reduce_max_seconds || '6000' }}
          BISECT: ${{ inputs.bisect_seconds || '1500' }}
        run: |
          export BIN=$PWD/target/release/rs-compiler-fuzzer KEYS_FILE=$PWD/stored-keys.txt TOOLCHAIN=retriage
          # about 1:50 per job in total (the setup before this step takes ~7 minutes): minimisation may use nearly all of it
          end=$((SECONDS + 103 * 60)); n=0; : > retriaged-keys.txt
          for i in $(seq 1 "$LIMIT"); do
            # not enough time for another finding (reduction + regression range + reproduction matrix)
            [ $((end - SECONDS)) -lt 900 ] && { echo "no time left for another finding"; break; }
            "$BIN" retriage --pkg pkg --shard "${{ matrix.shard }}" --limit 1 --skip retriaged-keys.txt --budget "$REDUCE" --budget-max "$REDUCE_MAX" --deadline $((end - SECONDS)) --bisect "$BISECT" --out retriage-out | tee one.txt
            k=$(sed -n 's/^RETRIAGED //p' one.txt | head -n1)
            [ -z "$k" ] && { echo "nothing (more) to re-triage in this shard"; break; }
            rm -rf upd && mkdir -p "upd/$k" && cp -r "pkg/findings/$k/." "upd/$k/"
            ADD_DIRS="upd" tools/release_sync.sh tools/store_mutator.sh
            echo "$k" >> retriaged-keys.txt; n=$((n + 1))
          done
          echo "re-triaged in this shard: $n" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: retriage-${{ strategy.job-index }}
          path: |
            upd
            retriaged-keys.txt
            tmp/*.log
          if-no-files-found: ignore
          retention-days: 14
