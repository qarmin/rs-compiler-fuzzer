name: fuzz

# Long-running fuzzing. One job per (toolchain, strategy) so the pool of concurrent
# runners is used; findings are zipped and stored in the `Nightly` release (see verify.yml).
on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "How long each job keeps starting new batches"
        default: "100"
      scale:
        description: "Batch size in percent of the per-strategy default (25k-150k lines)"
        default: "100"
      strategies:
        description: "Comma separated strategies"
        default: "arith,loops,control,borrows,memory,traits"
      toolchains:
        description: "Comma separated toolchains"
        default: "nightly,stable"
      seed:
        description: "Fuzzer seed (empty = time based)"
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE: Nightly

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          STRATEGIES: ${{ inputs.strategies || 'arith,loops,control,borrows,memory,traits' }}
          TOOLCHAINS: ${{ inputs.toolchains || 'nightly,stable' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          inc = [{"toolchain": t.strip(), "strategy": s.strip()}
                 for t in os.environ["TOOLCHAINS"].split(",") for s in os.environ["STRATEGIES"].split(",")]
          print("matrix=" + json.dumps({"include": inc}))
          PY

  # Create the storage release once, before the parallel jobs race to upload into it.
  prepare:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE" --repo "$GITHUB_REPOSITORY" --prerelease --title "$RELEASE" \
              --notes "Zipped reproducers found by the fuzzer (<toolchain>__<strategy>_<config>_<n>__<hash>.zip). verify.yml re-runs them daily."

  fuzz:
    needs: [plan, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchains (fuzzer is built with stable, the target toolchain is tested)
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal
          rustc +${{ matrix.toolchain }} -vV

      - run: cargo +stable build --release

      - name: Canaries
        continue-on-error: true
        run: ./target/release/rs-compiler-fuzzer canary --rustc "rustc +${{ matrix.toolchain }}" --configs O0,O3,O3-lto-fat --out fuzz-out

      - name: Fuzz
        env:
          DURATION_MIN: ${{ inputs.duration_minutes || '100' }}
          SCALE: ${{ inputs.scale || '100' }}
          SEED: ${{ inputs.seed }}
        run: |
          seed_arg=()
          if [ -n "$SEED" ]; then seed_arg=(--seed "$SEED"); fi
          ./target/release/rs-compiler-fuzzer fuzz \
            --rustc "rustc +${{ matrix.toolchain }}" \
            --duration $((DURATION_MIN * 60)) \
            --scale "$SCALE" \
            --strategies "${{ matrix.strategy }}" \
            --compile-timeout 600 \
            --max-findings 25 \
            --out fuzz-out \
            "${seed_arg[@]}"

      - name: Store new findings in the release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          shopt -s nullglob
          mkdir -p upload stage
          for d in fuzz-out/findings/*/; do
            name=$(basename "$d")
            h=$(sha256sum "$d/case.rs" | cut -c1-10)
            stem="${TOOLCHAIN}__${name#*_}__${h}"
            rm -rf "stage/$stem"; cp -r "$d" "stage/$stem"
            (cd stage && zip -qr "../upload/${stem}.zip" "$stem")
          done
          if compgen -G "upload/*.zip" > /dev/null; then
            gh release upload "$RELEASE" upload/*.zip --clobber --repo "$GITHUB_REPOSITORY"
          fi

      - name: Print findings into the log
        if: always()
        run: |
          shopt -s nullglob
          for d in fuzz-out/findings/*/ fuzz-out/known/*/; do
            echo "::group::$d"
            head -c 5000 "$d/report.md"
            echo; echo "----- case.rs (first 120 lines) -----"
            grep -v '^\s*$' "$d/case.rs" | awk '/^mod case_/{f=1} f' | head -120
            echo "::endgroup::"
          done

      - name: Summarise findings
        if: always()
        run: |
          shopt -s nullglob
          for r in fuzz-out/findings/*/report.md; do
            { echo "<details><summary>$r</summary>"; echo; cat "$r"; echo "</details>"; } >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: findings-${{ matrix.toolchain }}-${{ matrix.strategy }}
          path: |
            fuzz-out/findings
            fuzz-out/known
            fuzz-out/generator-bugs
          if-no-files-found: ignore
          retention-days: 14
