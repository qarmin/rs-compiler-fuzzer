name: fuzz

# Differential fuzzing of rustc. One job per (toolchain, strategy group).
#  - push to master : nightly only, `fast` profile (no fat/thin LTO, no single-CGU builds), many small groups
#  - ~00:00 Warsaw time daily (22:00 UTC; 23:00 in winter): nightly only, `full` profile
#  Every job: 45 min of fuzzing, then about an hour of triage/minimisation of what it found (about 2 h per job in total).
#  - manual dispatch: everything is configurable
# New findings are triaged (reproduced on stable/beta/nightly, reduced, Miri-checked, searched on GitHub) and merged into the
# single package `findings.zip` of the `Nightly` release (tools/release_sync.sh; verify.yml keeps it up to date).
on:
  push:
    branches: [master]
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Minutes each job keeps starting new batches (default 180, 45 on push; about an hour of triage follows)"
        default: ""
      profile:
        description: "fast = skip the slowest configs, full = everything (default full; fast on push)"
        type: choice
        options: ["", full, fast]
        default: ""
      scale:
        description: "Batch size in percent of the per-strategy default (default 100; 50 on push)"
        default: ""
      strategies:
        description: "Strategy groups: groups separated by ';', strategies inside a group by ','"
        default: ""
      toolchains:
        description: "Comma separated toolchains (default nightly; only nightly is fuzzed)"
        default: ""
      seed:
        description: "Fuzzer seed (empty = time based)"
        default: ""

permissions:
  contents: write

concurrency:
  group: fuzz-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CARGO_TERM_COLOR: always
  RELEASE: Nightly

jobs:
  plan:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      duration: ${{ steps.m.outputs.duration }}
      profile: ${{ steps.m.outputs.profile }}
      scale: ${{ steps.m.outputs.scale }}
    steps:
      - id: m
        env:
          EVENT: ${{ github.event_name }}
          IN_GROUPS: ${{ inputs.strategies }}
          IN_TOOLCHAINS: ${{ inputs.toolchains }}
          IN_PROFILE: ${{ inputs.profile }}
          IN_DURATION: ${{ inputs.duration_minutes }}
          IN_SCALE: ${{ inputs.scale }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          e = os.environ
          quick = e["EVENT"] == "push"
          # push (nightly only, free runner slots): finer groups = more parallel jobs; daily runs: 8 groups, nightly only
          wide = "arith;select;loops;control;recursion;enums;traits;borrows,asyncs;memory,shapes;abi,simd;collections,floats;unwind,generics;stdlib"
          narrow = "arith,select;loops;control,recursion;enums,traits;borrows,asyncs;memory,shapes,simd,abi;collections,floats,unwind,generics;stdlib"
          groups = e["IN_GROUPS"] or (wide if quick else narrow)
          toolchains = e["IN_TOOLCHAINS"] or "nightly"
          inc = [{"toolchain": t.strip(), "strategies": g.strip(), "name": g.strip().replace(",", "+")}
                 for t in toolchains.split(",") for g in groups.split(";")]
          print("matrix=" + json.dumps({"include": inc}))
          # the nightly run fuzzes for 3 hours and triages for about 1 more; pushes stay short
          print("duration=" + (e["IN_DURATION"] or ("45" if quick else "180")))
          print("profile=" + (e["IN_PROFILE"] or ("fast" if quick else "full")))
          print("scale=" + (e["IN_SCALE"] or ("50" if quick else "100")))
          PY

  # Create the storage release once, before the parallel jobs race to upload into it.
  prepare:
    runs-on: ubuntu-26.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE" --repo "$GITHUB_REPOSITORY" --prerelease --title "$RELEASE" \
              --notes "Storage for rs-compiler-fuzzer: findings.zip holds every finding (findings/<strategy>__<config>__<hash>/ with STATUS.md, reduced.rs, ISSUE.md ...) and INDEX.md. Updated by fuzz.yml and verify.yml."

  fuzz:
    name: fuzz (${{ matrix.toolchain }}, ${{ matrix.name }})
    needs: [plan, prepare]
    runs-on: ubuntu-26.04
    timeout-minutes: 355   # ~7 min setup + 180 min fuzzing (+ up to 30 min to finish minimising) + up to ~120 min triage (GitHub's limit is 6 h)
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchains (fuzzer is built with stable, the target toolchain is tested)
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal
          rustc +${{ matrix.toolchain }} -vV

      - run: cargo +stable build --release

      - name: Cache the reducers (Shrink Ray, cargo-bisect-rustc)
        uses: actions/cache@v6
        with:
          path: |
            ~/sr
            ~/.cargo/bin/cargo-bisect-rustc
          key: reducers-${{ runner.os }}-v1
      - name: Install triage tools (other channels, Miri, Shrink Ray)
        run: |
          for c in stable beta nightly; do rustup toolchain install $c --profile minimal; done
          rustup component add miri rust-src --toolchain nightly || echo "miri unavailable on this nightly"
          [ -x "$HOME/.cargo/bin/cargo-bisect-rustc" ] || cargo +stable install cargo-bisect-rustc --locked || echo "cargo-bisect-rustc unavailable"

      - name: Canaries
        continue-on-error: true
        run: ./target/release/rs-compiler-fuzzer canary --lto --rustc "rustc +${{ matrix.toolchain }}" --configs O0,O1,O3,Oz,O3-lto-fat --out fuzz-out

      - name: Fuzz
        env:
          DURATION_MIN: ${{ needs.plan.outputs.duration }}
          PROFILE: ${{ needs.plan.outputs.profile }}
          SCALE: ${{ needs.plan.outputs.scale }}
          SEED: ${{ inputs.seed }}
        run: |
          seed_arg=()
          if [ -n "$SEED" ]; then seed_arg=(--seed "$SEED"); fi
          ./target/release/rs-compiler-fuzzer fuzz \
            --rustc "rustc +${{ matrix.toolchain }}" \
            --duration $((DURATION_MIN * 60)) \
            --profile "$PROFILE" \
            --scale "$SCALE" \
            --strategies "${{ matrix.strategies }}" \
            --compile-timeout 600 \
            --max-findings 25 \
            --out fuzz-out \
            "${seed_arg[@]}"

      # The raw findings are stored first: whatever happens to the runner during the long triage, they are not lost.
      - name: Store the findings in the single package (release asset findings.zip)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          adds=""
          for d in fuzz-out/findings fuzz-out/triaged; do [ -d "$d" ] && adds="$adds $d"; done
          if [ -z "$adds" ]; then echo "nothing to store"; exit 0; fi
          export BIN=$PWD/target/release/rs-compiler-fuzzer KEYS_FILE=$PWD/stored-keys-raw.txt ADD_DIRS="$adds"
          tools/release_sync.sh tools/store_mutator.sh

      - name: Triage and store each finding (up to two hours; every result is stored right away)
        if: always()
        continue-on-error: true
        timeout-minutes: 130
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          shopt -s nullglob
          export BIN=$PWD/target/release/rs-compiler-fuzzer KEYS_FILE=$PWD/stored-keys.txt
          end=$((SECONDS + 120 * 60)); n=0
          for d in fuzz-out/findings/*/ fuzz-out/triaged/*/; do
            d=${d%/}
            left=$((end - SECONDS))
            { [ $n -ge 12 ] || [ $left -lt 900 ]; } && { echo "stopping triage (n=$n, ${left}s left); retriage.yml continues with the rest"; break; }
            part=$(( left / 3 )); [ $part -gt 3600 ] && part=3600
            "$BIN" triage --dir "$d" --budget $part --bisect $part --out triage-out || true
            ADD_DIRS="$d" tools/release_sync.sh tools/store_mutator.sh || true
            n=$((n + 1))
          done

      - name: Print findings into the log
        if: always()
        run: |
          shopt -s nullglob
          for d in fuzz-out/findings/*/ fuzz-out/triaged/*/; do
            echo "::group::NEW/TRIAGED $d"
            cat "$d/STATUS.md" 2>/dev/null | head -c 6000; echo
            head -c 5000 "$d/report.md"
            echo; echo "----- case.rs (first 120 lines) -----"
            grep -v '^\s*$' "$d/case.rs" | awk '/^mod case_/{f=1} f' | head -120
            echo "::endgroup::"
          done
          echo "---- already reported (known) ----"
          for d in fuzz-out/known/*/; do
            echo "$d"; sed 's/^/    /' "$d/known-issues.txt"
          done

      - name: Summarise findings
        if: always()
        run: |
          shopt -s nullglob
          {
            echo "### ${{ matrix.toolchain }} / ${{ matrix.name }}"
            echo "- new: $(ls -d fuzz-out/findings/*/ 2>/dev/null | wc -l), triaged (unreported): $(ls -d fuzz-out/triaged/*/ 2>/dev/null | wc -l), known (already reported): $(ls -d fuzz-out/known/*/ 2>/dev/null | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"
          for d in fuzz-out/known/*/; do
            echo "- known \`$(basename "$d")\`: $(tr '\n' ' ' < "$d/known-issues.txt")" >> "$GITHUB_STEP_SUMMARY"
          done
          for r in fuzz-out/findings/*/ fuzz-out/triaged/*/; do
            v=$(sed -n 's/^progress=//p' "$r/status.cfg" 2>/dev/null)
            { echo "<details><summary>${v:-?} steps done - $r</summary>"; echo; cat "$r/STATUS.md" 2>/dev/null; echo; cat "$r/report.md"; echo "</details>"; } >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: findings-${{ matrix.toolchain }}-${{ matrix.name }}
          path: |
            fuzz-out/findings
            fuzz-out/triaged
            fuzz-out/known
            fuzz-out/generator-bugs
            stored-keys.txt
            tmp/*.log
          if-no-files-found: ignore
          retention-days: 14
