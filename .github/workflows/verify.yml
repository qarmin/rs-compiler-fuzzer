name: verify-stored-findings

# Re-runs every finding stored in the single package (`findings.zip` of the `Nightly` release) on the current
# toolchains. The result is written back into the package (status.cfg: repro.<channel>, last_verified,
# state open/fixed - nothing is deleted), using tools/release_sync.sh so concurrent jobs do not lose updates.
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE: Nightly

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        toolchain: [nightly, beta, stable]
    steps:
      - uses: actions/checkout@v6
      - run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - run: cargo +stable build --release

      - name: Verify and update the package
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          export BIN=$PWD/target/release/rs-compiler-fuzzer
          tools/release_sync.sh tools/verify_mutator.sh
          {
            echo "### ${{ matrix.toolchain }}: stored findings"
            echo '```'; grep -E '^(STILL|FIXED|verify:)' verify.log || echo '(nothing stored yet)'; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
