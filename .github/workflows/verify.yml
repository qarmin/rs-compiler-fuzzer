name: verify-stored-findings

# Re-runs every reproducer stored in the `Nightly` release on the current toolchains,
# so the collection says which problems still exist and which got fixed upstream.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      prune:
        description: "Delete assets that no longer reproduce from the release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE: Nightly

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        toolchain: [nightly, stable]
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - run: cargo +stable build --release

      - name: Download stored reproducers for this toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets cases
          gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "${{ matrix.toolchain }}__*.zip" --dir assets || echo "nothing stored yet"
          for z in assets/*.zip; do unzip -q -o "$z" -d cases; done
          ls cases | wc -l

      - name: Verify
        run: |
          ./target/release/rs-compiler-fuzzer verify --rustc "rustc +${{ matrix.toolchain }}" --dir cases --out verify-out 2>&1 | tee verify.log
          {
            echo "### ${{ matrix.toolchain }}: stored reproducers"
            echo '```'; tail -n +1 verify.log | grep -E '^(STILL|FIXED|verify:)'; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prune fixed reproducers
        if: ${{ inputs.prune }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f verify-out/fixed.txt ] || exit 0
          while read -r stem; do
            [ -n "$stem" ] && gh release delete-asset "$RELEASE" "${stem}.zip" --repo "$GITHUB_REPOSITORY" -y
          done < verify-out/fixed.txt
