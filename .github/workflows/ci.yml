name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fuzzer builds, generation is deterministic, every strategy emits code that type-checks.
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      # nightly: the reducer tests use `-Z treat-err-as-bug` (a missing toolchain would be installed by rustup in the middle of the parallel tests)
      - run: rustup toolchain install stable nightly --profile minimal && rustup default stable
      - run: cargo test --release --workspace

  # Short end-to-end run of every strategy on nightly (small batches).
  smoke:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install nightly --profile minimal
      - run: cargo +stable build --release
      - name: Canaries (known miscompilations must still be detected)
        run: ./target/release/rs-compiler-fuzzer canary --rustc "rustc +nightly" --configs O0,O3,O3-lto-fat --out fuzz-out
      - name: Fuzz (small batches)
        run: ./target/release/rs-compiler-fuzzer fuzz --rustc "rustc +nightly" --rounds 1 --scale 10 --profile fast --out fuzz-out
      - name: Print findings into the log
        if: always()
        run: |
          shopt -s nullglob
          for d in fuzz-out/findings/*/; do
            echo "::group::$d"; head -c 5000 "$d/report.md"; echo; awk '/^mod case_/{f=1} f' "$d/case.rs" | head -120; echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: smoke-findings
          path: |
            fuzz-out/findings
            fuzz-out/known
            fuzz-out/generator-bugs
          if-no-files-found: ignore

  # End-to-end test of triage + reduction (shrinkray, Miri, bisect off): a known crash must shrink a lot.
  reduce:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install nightly --profile minimal
      - run: cargo +stable build --release
      - name: Install reducers
        run: |
          python3 -m venv "$HOME/sr" && "$HOME/sr/bin/pip" install -q shrinkray
          echo "$HOME/sr/bin" >> "$GITHUB_PATH"
      - name: Triage the checked-in LLVM EFLAGS crash
        run: |
          mkdir -p tri/f && cp reports/llvm-eflags-o0-crash.rs tri/f/case.rs
          printf 'strategy=arith\nbase_name=O1\nbase_flags=-C opt-level=1\nbad_name=O0\nbad_flags=-C opt-level=0\nbatch_seed=1\ntoolchain=nightly\n' > tri/f/repro.cfg
          printf 'rustc-LLVM ERROR: Unable to copy EFLAGS physical register!' > tri/f/signature.txt
          ./target/release/rs-compiler-fuzzer triage --dir tri/f --budget 420 --no-search --out tri/out
          cat tri/f/STATUS.md
          echo "--- reduced.rs ---"; cat tri/f/reduced.rs
          test "$(wc -l < tri/f/reduced.rs)" -le 25 || { echo "reduction produced more than 25 lines"; exit 1; }
